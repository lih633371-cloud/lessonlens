function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function scoreClass(score){
  const s = Number(score);
  if(s >= 8) return 'score-high';
  if(s >= 5) return 'score-mid';
  return 'score-low';
}

function renderRadarChart(radarData){
  const labels = DIM_LABELS;
  const n = labels.length;
  const size = 340;
  const cx = size/2, cy = size/2;
  const maxR = 118;
  const levels = 5;

  function pointFor(i, valueRatio){
    const angle = (Math.PI * 2 * i) / n - Math.PI/2;
    const r = maxR * valueRatio;
    return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
  }

  let svg = `<svg viewBox="0 0 ${size} ${size+30}" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">`;

  for(let lvl = 1; lvl <= levels; lvl++){
    const ratio = lvl / levels;
    let pts = [];
    for(let i = 0; i < n; i++){
      const p = pointFor(i, ratio);
      pts.push(`${p.x},${p.y}`);
    }
    svg += `<polygon points="${pts.join(' ')}" fill="none" stroke="#E7E5E4" stroke-width="1" stroke-dasharray="3,3"/>`;
  }

  for(let i = 0; i < n; i++){
    const p = pointFor(i, 1);
    svg += `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="#E7E5E4" stroke-width="1"/>`;
  }

  let dataPts = [];
  let zeroPts = [];
  for(let i = 0; i < n; i++){
    const ratio = Math.max(0, Math.min(10, radarData[i] || 0)) / 10;
    const p = pointFor(i, ratio);
    dataPts.push(`${p.x},${p.y}`);
    const z = pointFor(i, 0.02);
    zeroPts.push(`${z.x},${z.y}`);
  }

  svg += `<polygon id="radarFill" points="${zeroPts.join(' ')}" fill="#EA580C" fill-opacity="0.28" stroke="#EA580C" stroke-width="2"/>`;

  for(let i = 0; i < n; i++){
    const ratio = Math.max(0, Math.min(10, radarData[i] || 0)) / 10;
    const p = pointFor(i, ratio);
    svg += `<circle class="radar-dot" data-final-cx="${p.x}" data-final-cy="${p.y}" cx="${cx}" cy="${cy}" r="4" fill="#fff" stroke="#EA580C" stroke-width="2"/>`;
  }

  for(let i = 0; i < n; i++){
    const p = pointFor(i, 1.24);
    let anchor = 'middle';
    if(p.x < cx - 5) anchor = 'end';
    else if(p.x > cx + 5) anchor = 'start';
    svg += `<text x="${p.x}" y="${p.y}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="#57534E">${escapeHtml(labels[i])}</text>`;
    const val = radarData[i] != null ? radarData[i] : '-';
    svg += `<text x="${p.x}" y="${p.y+14}" text-anchor="${anchor}" font-size="10.5" font-weight="800" fill="#EA580C">${escapeHtml(String(val))}</text>`;
  }

  svg += `</svg>`;
  return { svg, dataPts };
}

function animateRadar(container, finalPts){
  requestAnimationFrame(() => {
    const fill = container.querySelector('#radarFill');
    const dots = container.querySelectorAll('.radar-dot');
    if(fill){
      const steps = 24;
      let step = 0;
      const startPts = fill.getAttribute('points').split(' ').map(p => p.split(',').map(Number));
      const endPts = finalPts.map(p => p.split(',').map(Number));
      function frame(){
        step++;
        const t = Math.min(1, step/steps);
        const eased = 1 - Math.pow(1-t, 3);
        const interp = startPts.map((sp, i) => {
          const ep = endPts[i];
          return `${sp[0] + (ep[0]-sp[0])*eased},${sp[1] + (ep[1]-sp[1])*eased}`;
        });
        fill.setAttribute('points', interp.join(' '));
        if(t < 1) requestAnimationFrame(frame);
      }
      frame();
    }
    dots.forEach(dot => {
      const fx = parseFloat(dot.getAttribute('data-final-cx'));
      const fy = parseFloat(dot.getAttribute('data-final-cy'));
      const sx = parseFloat(dot.getAttribute('cx'));
      const sy = parseFloat(dot.getAttribute('cy'));
      const steps = 24;
      let step = 0;
      function frame(){
        step++;
        const t = Math.min(1, step/steps);
        const eased = 1 - Math.pow(1-t, 3);
        dot.setAttribute('cx', sx + (fx-sx)*eased);
        dot.setAttribute('cy', sy + (fy-sy)*eased);
        if(t < 1) requestAnimationFrame(frame);
      }
      frame();
    });
  });
}

function renderResult(data){
  const radarData = data.radar_data || [0,0,0,0,0];
  const { svg, dataPts } = renderRadarChart(radarData);

  const dimCards = (data.dimensions||[]).map(d => {
    const cls = scoreClass(d.score);
    return `
      <div class="dim-card">
        <div class="dim-head">
          <div class="dim-name">${escapeHtml(d.name)}</div>
          <div class="dim-score ${cls}">${escapeHtml(String(d.score))}/10</div>
        </div>
        <div class="dim-reason">${escapeHtml(d.reason||'')}</div>
      </div>
    `;
  }).join('');

  const suggestionCards = (data.suggestions||[]).map((s, i) => `
    <div class="suggestion-card">
      <div class="sg-row">
        <span class="sg-tag problem">问题 ${i+1}</span>
        <span class="sg-text">${escapeHtml(s.problem||'')}</span>
      </div>
      <div class="sg-row">
        <span class="sg-tag solution">方案</span>
        <span class="sg-text">${escapeHtml(s.solution||'')}</span>
      </div>
      <div class="sg-expected">预期效果：${escapeHtml(s.expected||'')}</div>
    </div>
  `).join('');

  resultArea.innerHTML = `
    <div class="result">
      <div class="result-cols">
        <div class="card panel col-radar">
          <div class="panel-label">五维诊断雷达图</div>
          <div class="radar-svg-wrap" id="radarWrap">${svg}</div>
          <div class="score-big">
            <div class="score-num">${escapeHtml(String(data.overall_score||'-'))}</div>
            <div class="score-label">总分（满分 100）</div>
          </div>
        </div>
        <div class="card panel col-detail">
          <div class="section-label">维度评分详情</div>
          ${dimCards}
          <div class="section-label">改进建议</div>
          ${suggestionCards}
        </div>
      </div>
    </div>
  `;

  const radarWrap = document.getElementById('radarWrap');
  animateRadar(radarWrap, dataPts);
}

function renderLoading(){
  resultArea.innerHTML = `
    <div class="card loading-shell">
      <div class="spinner"></div>
      <div class="loading-title">正在分析课件质量…</div>
      <div class="loading-sub">演示版模拟生成过程</div>
    </div>
  `;
}

const submitBtn = document.getElementById('submit');
const btnLabel = document.getElementById('btnLabel');
const resultArea = document.getElementById('resultArea');
const demoSelect = document.getElementById('demoSelect');

submitBtn.addEventListener('click', () => {
  const idx = parseInt(demoSelect.value, 10);
  submitBtn.disabled = true;
  btnLabel.textContent = '诊断中…';
  renderLoading();

  setTimeout(() => {
    renderResult(DEMO_DATA[idx]);
    submitBtn.disabled = false;
    btnLabel.textContent = '诊断课件质量';
  }, 900);
});
</script>

</body>
</html>
